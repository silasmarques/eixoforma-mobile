name: Lyfta Costas Batch 24

on:
  push:
    branches:
      - ops/lyfta-batch-download
    paths:
      - ".github/workflows/lyfta-batch-test.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Lyfta source assets
        shell: bash
        run: |
          mkdir -p /tmp/lyfta
          cat > /tmp/lyfta/download.py <<'PY'
          import json, os, re, ssl, urllib.request
          from html import unescape

          exercises = [
              ("ex_puxada_supinada","https://lyfta.app/exercise/cable-reverse-grip-pulldown-7aq"),
              ("ex_puxada_triangulo_polia_alta","https://www.lyfta.app/exercise/cable-lateral-pulldown-with-v-bar-7e7"),
              ("ex_puxada_estendida_polia","https://www.lyfta.app/exercise/cable-standing-lat-pushdown--76h"),
              ("ex_remada_baixa_triangulo","https://lyfta.app/exercise/cable-seated-row-with-v-bar-85g"),
              ("ex_remada_sentada_maquina","https://www.lyfta.app/exercise/lever-seated-row-85j"),
              ("ex_remada_articulada_maquina","https://lyfta.app/exercise/lever-alternating-narrow-grip-seated-row-0r"),
              ("ex_remada_t_barra","https://www.lyfta.app/exercise/lever-t-bar-row-1f"),
              ("ex_remada_alta_articulada","https://lyfta.app/exercise/lever-high-row-0y"),
              ("ex_remada_unilateral_maquina","https://lyfta.app/exercise/lever-one-arm-seated-row--76m"),
              ("ex_remada_unilateral_cabo","https://www.lyfta.app/exercise/cable-one-arm-bent-over-row-64p"),
              ("ex_barra_fixa_pronada","https://www.lyfta.app/exercise/pull-up-6rk"),
              ("ex_barra_fixa_supinada","https://www.lyfta.app/exercise/reverse-grip-pull-up-8d8"),
              ("ex_barra_fixa_com_peso","https://www.lyfta.app/exercise/weighted-pull-up-6wt"),
              ("ex_pulldown_unilateral","https://www.lyfta.app/exercise/cable-one-arm-lat-pulldown-75z"),
              ("ex_remada_alta_sentada","https://www.lyfta.app/exercise/seated-high-row-7q"),
              ("ex_levantamento_terra_convencional","https://www.lyfta.app/exercise/deadlift-2"),
              ("ex_rack_pull","https://www.lyfta.app/exercise/barbell-rack-pull-61i"),
              ("ex_encolhimento_barra","https://www.lyfta.app/exercise/barbell-shrug-61d"),
              ("ex_encolhimento_halteres","https://lyfta.app/exercise/dumbbell-shrug-7dn"),
              ("ex_crucifixo_inverso_maquina","https://www.lyfta.app/exercise/lever-seated-reverse-fly-6q6"),
              ("ex_crucifixo_inverso_cabo","https://www.lyfta.app/exercise/cable-standing-cross-over-high-reverse-fly-6fp"),
              ("ex_remada_inclinada_barra","https://www.lyfta.app/exercise/barbell-incline-row-60t"),
              ("ex_pullover_maquina","https://lyfta.app/exercise/lever-pullover-7ub"),
              ("ex_remada_peito_apoiado_halteres","https://www.lyfta.app/exercise/dumbbell-incline-row-6ij"),
          ]

          UA="Mozilla/5.0 AppleWebKit/605.1.15 Safari/605.1.15"
          ctx=ssl.create_default_context()

          def fetch(url,timeout=60):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:
                  return r.read(),dict(r.headers),r.geturl()

          def first_data(page):
              body,_,_=fetch(page)
              html=body.decode("utf-8","ignore")
              m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html,re.S)
              if not m:
                  raise RuntimeError("__NEXT_DATA__ missing")
              return json.loads(unescape(m.group(1)))["props"]["pageProps"]["firstData"]

          root="lyfta-costas-24"
          os.makedirs(root,exist_ok=True)
          manifest=[]

          for ex,page in exercises:
              rec={"exerciseId":ex,"pageUrl":page,"errors":[]}
              out=os.path.join(root,ex); os.makedirs(out,exist_ok=True)
              try:
                  first=first_data(page)
                  rec["lyftaId"]=first.get("id")
                  rec["lyftaName"]=first.get("name")
                  rec["imageUrl"]=first.get("image_name")
                  rec["videoUrl"]=first.get("video_file")

                  if rec["imageUrl"]:
                      try:
                          body,h,final=fetch(rec["imageUrl"])
                          with open(os.path.join(out,"source.png"),"wb") as fp: fp.write(body)
                          rec["image"]={"ok":True,"bytes":len(body),"contentType":h.get("Content-Type",""),"finalUrl":final}
                      except Exception as e:
                          rec["image"]={"ok":False,"error":repr(e)}
                          rec["errors"].append(f"image: {e!r}")

                  if rec["videoUrl"]:
                      try:
                          body,h,final=fetch(rec["videoUrl"])
                          with open(os.path.join(out,"source.mp4"),"wb") as fp: fp.write(body)
                          rec["video"]={"ok":True,"bytes":len(body),"contentType":h.get("Content-Type",""),"finalUrl":final}
                      except Exception as e:
                          rec["video"]={"ok":False,"error":repr(e)}
                          rec["errors"].append(f"video: {e!r}")

                  with open(os.path.join(out,"source.json"),"w",encoding="utf-8") as fp:
                      json.dump({
                          "exerciseId":ex,
                          "pageUrl":page,
                          "lyftaId":rec.get("lyftaId"),
                          "lyftaName":rec.get("lyftaName"),
                          "imageUrl":rec.get("imageUrl"),
                          "videoUrl":rec.get("videoUrl"),
                          "origin":"lyfta"
                      },fp,ensure_ascii=False,indent=2)
              except Exception as e:
                  rec["errors"].append(f"page: {e!r}")
              manifest.append(rec)

          summary={
              "requested":len(manifest),
              "pages_ok":sum(1 for r in manifest if r.get("lyftaName")),
              "images_ok":sum(1 for r in manifest if r.get("image",{}).get("ok")),
              "videos_ok":sum(1 for r in manifest if r.get("video",{}).get("ok")),
              "with_errors":sum(1 for r in manifest if r.get("errors"))
          }
          with open(os.path.join(root,"manifest.json"),"w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          with open(os.path.join(root,"summary.json"),"w",encoding="utf-8") as f:
              json.dump(summary,f,indent=2)
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/lyfta/download.py
      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyfta-costas-24
          path: lyfta-costas-24
          if-no-files-found: error
          retention-days: 3
