name: Lyfta Costas Missing Phase

on:
  push:
    branches:
      - ops/lyfta-batch-download
    paths:
      - ".github/workflows/lyfta-batch-test.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download missing second phase
        shell: bash
        run: |
          python - <<'PY'
          import os, ssl, urllib.request, json
          url="https://apilyfta.com/static/GymvisualPNG/12351102-Lever-One-Arm-Seated-Row-(Seated-row-machine)_Back_small.png"
          out="lyfta-costas-phase2/ex_remada_unilateral_maquina"
          os.makedirs(out,exist_ok=True)
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/*"})
          try:
              with urllib.request.urlopen(req,timeout=60,context=ssl.create_default_context()) as r:
                  body=r.read()
                  ctype=r.headers.get("Content-Type","")
              with open(out+"/source2.png","wb") as f: f.write(body)
              res={"ok":True,"url":url,"bytes":len(body),"contentType":ctype}
          except Exception as e:
              res={"ok":False,"url":url,"error":repr(e)}
          with open("lyfta-costas-phase2/result.json","w",encoding="utf-8") as f:
              json.dump(res,f,indent=2)
          print(json.dumps(res,indent=2))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyfta-costas-phase2
          path: lyfta-costas-phase2
          if-no-files-found: error
          retention-days: 3
