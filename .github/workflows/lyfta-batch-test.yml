name: Lyfta Exact Media Batch Test

on:
  push:
    branches:
      - ops/lyfta-batch-download
    paths:
      - ".github/workflows/lyfta-batch-test.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Lyfta source assets and build app derivatives
        shell: bash
        run: |
          python -m pip install --quiet pillow
          mkdir -p /tmp/lyfta
          cat > /tmp/lyfta/download.py <<'PY'
          import json, os, re, ssl, subprocess, urllib.request
          from html import unescape
          from PIL import Image, ImageOps

          exercises = [
              ("ex_supino_reto_halteres", "https://lyfta.app/exercise/dumbbell-bench-press-84"),
              ("ex_supino_inclinado_barra", "https://www.lyfta.app/exercise/barbell-incline-bench-press-7xv"),
              ("ex_supino_declinado_halteres", "https://www.lyfta.app/exercise/dumbbell-decline-bench-press--7zn"),
              ("ex_crucifixo_reto_halteres", "https://www.lyfta.app/exercise/dumbbell-fly-6ha"),
              ("ex_crucifixo_inclinado_halteres", "https://www.lyfta.app/exercise/dumbbell-incline-fly-7b3"),
          ]
          UA = "Mozilla/5.0 AppleWebKit/605.1.15 Safari/605.1.15"
          ctx = ssl.create_default_context()

          def fetch(url, timeout=60):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return r.read(), dict(r.headers), r.geturl()

          def save_url(url, path):
              body, headers, final = fetch(url)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(body)
              return {"sourceUrl": url, "finalUrl": final, "bytes": len(body), "contentType": headers.get("Content-Type","")}

          def extract_next_data(html):
              m = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S)
              if not m:
                  raise RuntimeError("__NEXT_DATA__ not found")
              return json.loads(unescape(m.group(1)))

          def make_thumbnail(src, dst):
              im = Image.open(src).convert("RGBA")
              canvas = Image.new("RGBA", (768,768), (255,255,255,255))
              im.thumbnail((690,690), Image.Resampling.LANCZOS)
              canvas.alpha_composite(im, ((768-im.width)//2, (768-im.height)//2))
              canvas.convert("RGB").save(dst, "WEBP", quality=80, method=6)

          def make_hero(video, fallback_img, dst):
              # Extract two movement phases from the exact Lyfta MP4.
              probe = subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",video
              ], text=True).strip()
              duration = max(float(probe), 0.5)
              times = [duration*0.18, duration*0.68]
              frames=[]
              for i,t in enumerate(times,1):
                  frame=f"/tmp/frame_{os.getpid()}_{i}.png"
                  subprocess.check_call([
                      "ffmpeg","-loglevel","error","-y","-ss",f"{t:.3f}","-i",video,
                      "-frames:v","1",frame
                  ])
                  frames.append(frame)

              canvas = Image.new("RGB",(768,768),"white")
              slots=[(18,120,375,648),(393,120,750,648)]
              for frame,box in zip(frames,slots):
                  im=Image.open(frame).convert("RGB")
                  # Crop away near-white borders while retaining figure/equipment.
                  px=im.load()
                  mask=Image.new("L",im.size,0)
                  mp=mask.load()
                  for y in range(im.height):
                      for x in range(im.width):
                          r,g,b=px[x,y]
                          if min(r,g,b) < 245 or max(r,g,b)-min(r,g,b) > 10:
                              mp[x,y]=255
                  bbox=mask.getbbox()
                  if bbox:
                      im=im.crop(bbox)
                  x0,y0,x1,y1=box
                  im.thumbnail((x1-x0,y1-y0),Image.Resampling.LANCZOS)
                  px0=x0+((x1-x0)-im.width)//2
                  py0=y0+((y1-y0)-im.height)//2
                  canvas.paste(im,(px0,py0))
                  os.remove(frame)

              canvas.save(dst,"WEBP",quality=80,method=6)

          root="lyfta-exact-test"
          os.makedirs(root,exist_ok=True)
          manifest=[]
          for ex_id,page_url in exercises:
              rec={"exerciseId":ex_id,"pageUrl":page_url,"errors":[]}
              out=os.path.join(root,ex_id)
              os.makedirs(out,exist_ok=True)
              try:
                  page_bytes,_,_=fetch(page_url)
                  html=page_bytes.decode("utf-8","ignore")
                  data=extract_next_data(html)
                  first=data["props"]["pageProps"]["firstData"]
                  rec["lyftaId"]=first.get("id")
                  rec["lyftaName"]=first.get("name")
                  rec["imageUrl"]=first.get("image_name")
                  rec["videoUrl"]=first.get("video_file")
                  src_img=os.path.join(out,"source.png")
                  src_vid=os.path.join(out,"source.mp4")
                  rec["imageDownload"]=save_url(rec["imageUrl"],src_img)
                  rec["videoDownload"]=save_url(rec["videoUrl"],src_vid)
                  make_thumbnail(src_img,os.path.join(out,"thumbnail.webp"))
                  make_hero(src_vid,src_img,os.path.join(out,"hero.webp"))
                  for name in ["source.png","source.mp4","thumbnail.webp","hero.webp"]:
                      rec.setdefault("files",{})[name]=os.path.getsize(os.path.join(out,name))
              except Exception as e:
                  rec["errors"].append(repr(e))
              manifest.append(rec)

          with open(os.path.join(root,"manifest.json"),"w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)

          ok=[r for r in manifest if not r["errors"] and "files" in r]
          print(json.dumps({
              "requested":len(manifest),
              "complete":len(ok),
              "failed":len(manifest)-len(ok),
              "image_bytes":sum(r.get("files",{}).get("source.png",0) for r in ok),
              "video_bytes":sum(r.get("files",{}).get("source.mp4",0) for r in ok)
          },indent=2))
          for r in manifest:
              print(r["exerciseId"], r.get("lyftaName"), "errors=",r["errors"])
          if len(ok) != len(manifest):
              raise SystemExit("One or more exercises failed")
          PY
          python /tmp/lyfta/download.py

      - name: Upload exact media batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyfta-exact-test
          path: lyfta-exact-test
          if-no-files-found: error
          retention-days: 3
